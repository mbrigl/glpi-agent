# SPDX-License-Identifier: GPL-2.0-only
#
# Builds the `glpi-agent` installer for all three platforms:
#   - Linux  : .deb + .rpm + .tar.gz + .AppImage  (x86_64, aarch64),
#              plus Snap (x86_64, aarch64) and Flatpak (x86_64) in their own jobs
#   - Windows: .msi (WiX)         (x86_64, aarch64)
#   - macOS  : .pkg               (x86_64, aarch64)
#
# Runs on a `v*` tag (attaching the installers to a GitHub Release) and on
# manual dispatch (artifacts only). The default build is pure Rust — the
# off-by-default `libiec61850` feature is not enabled, so no C library is needed.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into package names (no leading v)"
        required: false
        default: "2.0.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: glpi-agent

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            kind: linux
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            kind: linux
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            kind: windows
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            kind: windows
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            kind: macos
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            kind: macos
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          echo "version=${v:-2.0.0}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Belt-and-suspenders: guarantee the std for this target is present
      # (idempotent — a no-op for a native target).
      - name: Ensure Rust target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release -p glpi-cli --target ${{ matrix.target }}

      # ---------- Linux: .deb + .rpm ----------
      - name: Package Linux (deb + rpm)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb cargo-generate-rpm --locked
          mkdir -p dist
          # cargo-deb rewrites target/release -> target/<triple>/release for --target.
          cargo deb -p glpi-cli --target ${{ matrix.target }} --no-build
          cp target/${{ matrix.target }}/debian/*.deb dist/
          cargo generate-rpm -p crates/glpi-cli --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/
          # A portable tarball alongside the native packages.
          tar -C target/${{ matrix.target }}/release -czf \
            "dist/${BIN_NAME}-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz" "${BIN_NAME}"

      - name: Package Linux (AppImage)
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          arch="$(uname -m)"
          appdir="AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$appdir/usr/bin/"
          cat > "$appdir/usr/share/applications/${BIN_NAME}.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=GLPI Agent
          Exec=${BIN_NAME}
          Icon=${BIN_NAME}
          Categories=Utility;System;
          Terminal=true
          DESKTOP
          cp "$appdir/usr/share/applications/${BIN_NAME}.desktop" "$appdir/${BIN_NAME}.desktop"
          # A simple solid-colour launcher icon (font-independent).
          convert -size 256x256 xc:'#1565C0' \
            "$appdir/usr/share/icons/hicolor/256x256/apps/${BIN_NAME}.png"
          cp "$appdir/usr/share/icons/hicolor/256x256/apps/${BIN_NAME}.png" "$appdir/${BIN_NAME}.png"
          cat > "$appdir/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/glpi-agent" "$@"
          APPRUN
          chmod +x "$appdir/AppRun"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage"
          chmod +x appimagetool
          ARCH="$arch" ./appimagetool --appimage-extract-and-run "$appdir" \
            "dist/${BIN_NAME}-${{ steps.version.outputs.version }}-${arch}.AppImage"

      # ---------- Windows: .msi ----------
      - name: Install WiX toolset
        if: matrix.kind == 'windows'
        shell: pwsh
        run: choco install wixtoolset --version=3.14.1 --no-progress -y

      - name: Package Windows (msi)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          cargo install cargo-wix --locked
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          cargo wix -p glpi-cli `
            --target ${{ matrix.target }} `
            --no-build --nocapture `
            --output "dist/${env:BIN_NAME}-${{ steps.version.outputs.version }}-${{ matrix.target }}.msi"

      # ---------- macOS: .pkg ----------
      - name: Package macOS (pkg)
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist staging/usr/local/bin
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" staging/usr/local/bin/
          pkgbuild \
            --root staging \
            --identifier org.glpi.agent \
            --version "${{ steps.version.outputs.version }}" \
            --install-location / \
            "dist/${BIN_NAME}-${{ steps.version.outputs.version }}-${{ matrix.target }}.pkg"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  snap:
    name: snap-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build snap
        id: snapcraft
        uses: snapcore/action-build@v1
      - name: Collect snap
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ steps.snapcraft.outputs.snap }}" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: installers-snap-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  flatpak:
    name: flatpak-x86_64
    needs: build
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Download the Linux x86_64 build
        uses: actions/download-artifact@v4
        with:
          name: installers-linux-x86_64
          path: dl
      - name: Stage the prebuilt binary next to the manifest
        shell: bash
        run: |
          set -euo pipefail
          tar -C dl -xzf dl/${BIN_NAME}-*-x86_64-unknown-linux-gnu.tar.gz
          install -Dm755 "dl/${BIN_NAME}" "packaging/flatpak/${BIN_NAME}"
      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: glpi-agent.flatpak
          manifest-path: packaging/flatpak/org.glpi.Agent.yaml
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Collect flatpak
        shell: bash
        run: |
          mkdir -p dist
          cp glpi-agent.flatpak "dist/${BIN_NAME}-x86_64.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-flatpak-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, snap, flatpak]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create / update the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
